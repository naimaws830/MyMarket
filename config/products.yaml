# MyMarket product configuration.
# One domain only: food_staples. Price truth is daily PriceCatcher.
# Aliases and exclude phrases come from PRD section 5.

label:
  horizon_days: 14        # H in PRD 6.4
  theta_k: 0.5            # k in PRD 6.4, theta_p = k * std(ret) over TRAIN only
  min_premises: 5         # skip a day with fewer reporting premises than this

filter:
  # Stage two scores an article as (best similarity to the product description
  # sentences) minus (best similarity to the distractor sentences below).
  #
  # A plain similarity does not work here. The e5 model scores anything vaguely
  # on topic in the 0.82 to 0.88 band, and "Best fried chicken restaurants in
  # Kuala Lumpur" actually scores higher than "Chicken prices rise as feed costs
  # climb". Subtracting the distractors is what separates them.
  #
  # Target precision for this MVP is 0.70, agreed down from the 0.80 in the
  # PRD because 0.80 was not reachable at any threshold. That target is NOT
  # currently met. Measured, honestly:
  #
  #   round 1, 120 rows, 21 relevant, labelled in house:
  #     threshold 0.015 -> precision 0.607, recall 0.810
  #     threshold 0.020 -> precision 0.700, recall 0.667
  #   round 2, 120 rows, 30 relevant, labelled independently by a teammate
  #   using a different pipeline, so a genuine held out check:
  #     threshold 0.015 -> precision 0.552, recall 0.571
  #     threshold 0.020 -> precision 0.500, recall 0.321
  #
  # The 0.700 on round 1 did not survive. The distractor sentences had been
  # tuned on those same 21 positives, so it was an overfit. 0.015 is chosen
  # because it is the more stable of the two across both sets and keeps far
  # more recall. Treat real precision as roughly 0.55 to 0.60.
  #
  # Re-tune with: python scripts/02_prepare_news.py --tune-filter
  embed_threshold: 0.015
  body_chars: 1500        # how much body text the alias stage reads

  # What a product word looks like when the article is NOT about the retail
  # shelf price a shopper pays. Each line here was added because the M5 audit
  # showed it surviving the filter.
  distractor_sentences:
    - A restaurant review, a recipe or a food lifestyle story.
    - A wildlife, nature or conservation story.
    - A sports, entertainment or celebrity story.
    - A company brand, a product launch or a marketing campaign.
    - A crime, an accident or a court story.
    - A health, nutrition or diet article.
    # Upstream commodity trade. A crude palm oil futures or plantation output
    # story is not a retail cooking oil price story, and these were the single
    # biggest source of false positives in the audit.
    - Crude palm oil futures, CPO prices, plantation output or export tonnage.
    - Biodiesel, biorefinery or renewable fuel policy.
    - A stock market, banking, earnings or corporate deal story.
    - Customs enforcement, smuggling or contraband seizures.
    - A weather, flood or disaster report with no mention of prices.

domains:
  food_staples:
    label: Food Staples
    price_source: pricecatcher
    frequency: daily

    # The PRD applied a price cue rule to electronics only, on the grounds that
    # most phone news is launches and reviews. The M5 audits showed food needs
    # it just as badly: The Star's food coverage is dominated by recipes,
    # buffets and restaurant pieces that mention these words constantly.
    #
    # Measured on the held out teammate audit set:
    #   alias only                 precision 0.283
    #   embedding only, 0.015      precision 0.552
    #   price cue in title         precision 0.800
    #   price cue AND embedding    precision 0.875
    #
    # The cue costs recall, so it buys quality at the price of volume. For a
    # product whose whole claim is that NEWS moves prices, training on articles
    # that are not about prices teaches the model nothing.
    requires_price_cue: true
    price_cue_words:
      - price
      - prices
      - pricing
      - harga
      - cost
      - costs
      - cheaper
      - expensive
      - subsidy
      - subsidi
      - subsidised
      - subsidized
      - tariff
      - levy
      - tax
      - SST
      - shortage
      - supply
      - import
      - export
      - inflation
      - ceiling
      - price control
      - kawalan harga
      - hike
      - profiteering
      - stockpile
      - glut

    # Event words are model features, not relevance filters. PRD F5.
    event_words:
      - subsidy
      - subsidi
      - ceiling price
      - harga siling
      - SHMMP
      - shortage
      - kekurangan
      - flood
      - banjir
      - import ban
      - export ban
      - tariff
      - levy
      - SST
      - price control
      - kawalan harga
      - festive
      - Hari Raya
      - Ramadan
      - Chinese New Year
      - ringgit
      - drought
      - bird flu
      - feed cost
      - minimum wage
      - palm oil

    products:
      rice:
        label: Rice
        aliases_en: [rice, local white rice, imported rice]
        aliases_ms: [beras, beras tempatan, padi]
        exclude_phrases: [fried rice, chicken rice, rice cooker, rice bowl]
        description_sentences:
          - The retail price of rice in Malaysia went up or down.
          - Supply, shortage, import, export ban or subsidy of rice and paddy.
          - Government subsidy, price control or cost of living measures affecting rice.
        # PriceCatcher item_category values that hold this product. Used to keep
        # a safe superset at download time and to suggest rows for the M3 review.
        preferred_categories: [BERAS]
        # Name fragments that are the wrong thing inside the right category.
        reject_item_terms: [PULUT, BASMATHI, BAYI, TEPUNG]
        item_codes: []          # filled from config/item_mapping.csv at M3

      egg:
        label: Egg
        aliases_en: [egg, eggs]
        aliases_ms: [telur]
        exclude_phrases: [Easter egg, nest egg, egg roll, egg tart]
        description_sentences:
          - The retail price of chicken eggs in Malaysia went up or down.
          - Supply, shortage, subsidy or ceiling price of eggs.
          - Government subsidy, price control or cost of living measures affecting eggs.
        preferred_categories: [TELUR]
        # Quail, duck, salted and free range eggs are different products.
        reject_item_terms: [PUYUH, ITIK, MASIN, KAMPUNG]
        item_codes: []

      cooking_oil:
        label: Cooking Oil
        aliases_en: [cooking oil, vegetable oil]
        aliases_ms: [minyak masak]
        exclude_phrases: [engine oil, crude oil price, oil and gas]
        description_sentences:
          - The retail price of cooking oil in Malaysia went up or down.
          - Subsidy, supply, shortage or cost of cooking oil.
          - Government subsidy, price control or cost of living measures affecting cooking oil.
        # Palm oil is an event word, not an alias. It is a crude price story.
        preferred_categories: [MINYAK DAN LEMAK]
        reject_item_terms: [SAPI, GHEE]
        item_codes: []

      chicken:
        label: Chicken
        aliases_en: [chicken, poultry, broiler]
        aliases_ms: [ayam]
        exclude_phrases: [chicken rice, Ayam Brand, KFC, chicken chop, fried chicken outlet]
        description_sentences:
          - The retail price of chicken in Malaysia went up or down.
          - Supply, feed cost, ceiling price or shortage of chicken.
          - Government subsidy, price control or cost of living measures affecting chicken.
        preferred_categories: [AYAM]
        reject_item_terms: [BELANDA, TUA]
        item_codes: []
